# Configuración del bot. Los secretos van en .env, nunca aquí.
# Las secciones `risk` y `limits` están protegidas: el módulo de aprendizaje
# no puede modificarlas (CLAUDE.md §1.7 y §9). Además, core/config.py impone
# topes duros en código que este archivo no puede superar.

mode: paper            # record | backtest | paper | testnet | live

exchange:
  name: binance        # binance | bybit (capa abstracta)
  market: usdm_futures
  symbols: [BTCUSDT, ETHUSDT, SOLUSDT, XRPUSDT, DOGEUSDT, XLMUSDT]
  verify_symbols_on_start: true
  fees:                # nivel base Binance USDⓈ-M (verificar en la doc oficial)
    maker: 0.0002
    taker: 0.0005
    bnb_discount: 0.0  # 0.10 si se pagan comisiones con BNB
  recv_window_ms: 5000

risk:
  risk_per_trade: 0.005          # 0.5 % del capital
  max_daily_loss: 0.02           # 2 % -> sin entradas hasta 00:00 UTC
  max_drawdown: 0.10             # 10 % desde el pico -> bot detenido, reinicio manual
  max_consecutive_losses: 4
  consecutive_loss_pause_hours: 4
  max_leverage: 3
  max_concurrent_positions: 2
  max_net_exposure: 1.5          # nocional neto en una dirección / capital
  max_positions_per_symbol: 1
  min_stop_atr_multiple: 1.0     # stop mínimo = 1.0 × ATR(15m)
  high_vol_percentile: 90
  high_vol_size_factor: 0.5
  correlation_threshold: 0.8
  correlation_size_factor: 0.5
  max_fee_share_of_target: 0.25

limits:
  max_trades_per_day: 5          # techo duro; nunca > 5 sin aprobación humana
  base_trades_per_day: 3         # entradas 1..3 con filtros normales
  extra_trade_min_edge: 4.0      # entradas 4 y 5: ventaja ≥ 4× costo
  extra_trade_min_confidence: 0.75
  losing_day_trade_cap: 3
  losing_day_loss_count: 2       # 2 pérdidas en el día -> techo 3
  losing_day_loss_pct: 0.01      # o −1 % en el día -> techo 3
  max_trades_per_symbol_per_day: 2
  symbol_cooldown_minutes: 60
  reversal_cooldown_minutes: 240
  candidate_window_minutes: 15
  # Pausa una moneda+dirección que viene perdiendo (idea de freqtrade): 3 operaciones con pérdida total > 1,2 % → 24 h.
  # APAGADA: con 13 meses de datos empeoró trend_breakout de −0,04R a −0,29R por operación y la llevó a la detención
  # (bloqueaba justo las entradas que se recuperan tras una mala racha). Se puede encender con true.
  underperf_enabled: false
  underperf_lookback_trades: 3
  underperf_max_loss_pct: 0.012
  underperf_lock_hours: 24

filters:
  min_edge_cost_multiple: 3.0
  macro_block_before_min: 30
  macro_block_after_min: 60
  dangerous_funding_z: 2.5
  oi_high_lookback_days: 30
  extreme_vol_percentile: 98
  max_spread_bps: 5
  min_depth_multiple: 5          # profundidad top-10 ≥ 5× tamaño de la orden

execution:
  post_only_timeout_s: 20
  post_only_retries: 1
  market_entry_min_edge: 4.0
  stop_confirm_timeout_s: 5      # si el stop no se confirma -> cerrar a mercado
  reconcile_interval_s: 30

position:
  partial_take_r: 2.0     # mover el stop a "sin pérdida" antes (1R) empeoraba mucho: cortaba las ganadoras
  partial_take_fraction: 0.5
  trailing_atr_multiple: 2.0
  time_exit_hours: 48   # la investigación mostró que cortar pronto sin avanzar perdía las mejores operaciones
  time_exit_min_r: 0.5

ai:
  decision_model: claude-sonnet-5-5
  reflection_model: claude-sonnet-5-5
  news_model: claude-haiku-5-5
  timeout_s: 30
  max_calls_per_hour: 10
  max_calls_per_day: 60
  max_news_headlines: 8
  max_active_lessons: 10
  schema_retries: 1
  decision_effort: medium
  news_effort: low
  refusal_fallback: true
  max_news_calls_per_hour: 20

data:
  ttl_s:
    market: 5
    funding: 60
    open_interest: 900
    dvol: 900
    onchain: 129600               # DefiLlama publica 1 dato por día: vigente 36 h
    dex: 300
    sentiment: 129600
    news: 1800
    macro: 86400
  poll_s:
    open_interest: 300
    dvol: 120
    onchain: 3600
    dex: 60
    sentiment: 3600
    news: 90
    macro: 86400
  news_max_age_min: 30
  dir: bot/data

learning:
  require_human_approval: true
  challenger_min_cases: 50
  challenger_min_trades: 20
  lesson_expiry_days: 30
  max_hypotheses_per_week: 3

alerts:
  telegram_enabled: true   # solo envía si TELEGRAM_BOT_TOKEN y TELEGRAM_CHAT_ID están en .env (configurar_telegram.bat)

logging:
  dir: bot/data/logs
  level: INFO
  backup_days: 30

paper:
  # Capital ficticio del modo demo, en USDT: 27 ≈ 500 pesos mexicanos. Con 0,5 % de riesgo por operación
  # se arriesgan ~0,14 $ por operación. Binance exige un mínimo por orden (BTC ~100 USDT, ETH ~20 USDT, el resto
  # ~5 USDT): con este capital BTC casi nunca se podrá operar. Si se cambia, al arrancar se archiva la demo
  # anterior en bot/data/archivo/ y se empieza de cero (bot/demo_reset.py).
  initial_capital: 27
  latency_ms: 150

storage:
  db_path: bot/data/bot.sqlite
  reports_dir: bot/reports
  state_path: bot/data/state.json   # guardias persistentes (p. ej. drawdown -> detenido)

# Rutas verificadas 2026-10-15 (búsqueda de doc oficial; el host developers.binance.com
# no fue accesible directamente desde el entorno de desarrollo). Re-verificar al desplegar.
endpoints:
  binance:
    rest: https://fapi.binance.com
    ws_public: wss://fstream.binance.com/public     # depth, bookTicker
    ws_market: wss://fstream.binance.com/market     # aggTrade, kline, markPrice
    ws_private: wss://fstream.binance.com/private   # user data (listenKey)
  binance_testnet:    # los datos de mercado se toman siempre de producción; aquí solo órdenes
    rest: https://testnet.binancefuture.com    # verificado en doc oficial (vía búsqueda)
    ws_public: wss://fstream.binancefuture.com/public
    ws_market: wss://fstream.binancefuture.com/market
    ws_private: wss://fstream.binancefuture.com/private
  deribit: https://www.deribit.com/api/v2
  hyperliquid: https://api.hyperliquid.xyz/info
  alternative_me: https://api.alternative.me/fng/
  defillama_stablecoins: https://stablecoins.llama.fi
  stellar_horizon: https://horizon.stellar.org
  forexfactory_week: https://nfs.faireconomy.media/ff_calendar_thisweek.json
  cryptopanic: https://cryptopanic.com/api/developer/v2/posts/   # de pago desde 2026; opcional

news:
  rss_feeds:
    - https://www.coindesk.com/arc/outboundfeeds/rss/
    - https://cointelegraph.com/rss
    - https://decrypt.co/feed
    - https://www.theblock.co/rss.xml
  trusted_sources: [coindesk, cointelegraph, decrypt, theblock, reuters, bloomberg]
  high_impact_keywords: [hack, exploit, etf, sec, delist, delisting, liquidation, liquidated,
                         lawsuit, bankruptcy, halt, outage, approval, ban, sanction, fed, cpi]
  symbol_keywords:
    BTCUSDT: [bitcoin, btc]
    ETHUSDT: [ethereum, eth, ether]
    SOLUSDT: [solana, sol]
    XRPUSDT: [xrp, ripple]
    DOGEUSDT: [dogecoin, doge]
    XLMUSDT: [stellar, xlm]
  dedupe_similarity: 0.8

# Parámetros de estrategia. Es lo único que el aprendizaje puede proponer cambiar
# (con aprobación humana por defecto). Nada de riesgo, stops ni ejecución aquí.
strategies:
  # Investigación 2026-10 (13 meses, 6 monedas, walk-forward y guardias reales): solo trend_breakout aguantó el
  # periodo completo sin tocar la detención por caída. "Dejar correr las ganancias" (objetivo 4:1, hasta 48 h, parcial
  # en 2R) fue la primera versión positiva en ajuste Y comprobación (+0.037R / +0.035R por op, PF 1.05; meseta estable
  # con objetivos 10–14 ATR y 36–72 h). Ventaja pequeña y aún no confirmada estadísticamente: por eso sigue en demo.
  # Las otras tres perdían de forma consistente (−0.13R a −0.28R/op) y quedan apagadas; se pueden reactivar aquí.
  trend_breakout:
    enabled: true
    target_atr_multiple: 12.0
    stop_atr_multiple: 3.0
    max_hold_hours: 48
    min_adx: 20
    min_rel_volume: 1.2
  trend_pullback:
    enabled: false
    target_atr_multiple: 4.0
    stop_atr_multiple: 2.0
    max_hold_hours: 24
    min_adx: 30
    max_ema_distance_atr: 0.5
  range_breakout:
    enabled: false
    target_atr_multiple: 3.0
    stop_atr_multiple: 1.2
    max_hold_hours: 6
    range_bars: 24
    max_range_atr: 4.0
    min_rel_volume: 1.5
  funding_reversion:
    enabled: false
    target_atr_multiple: 2.0
    stop_atr_multiple: 1.5
    max_hold_hours: 12
    min_funding_z: 2.0
    min_fng_extreme: 20

# Traders destacados de Hyperliquid (cuentas públicas): su posicionamiento entra como contexto
# (campos dex.smart_*) para la IA y el aprendizaje, y sus movimientos se muestran en el panel.
# Nunca se copian operaciones.
top_traders:
  enabled: true
  count: 30                      # cuántas cuentas seguir
  refresh_hours: 6               # cada cuánto se vuelve a elegir del ranking
  poll_s: 120                    # cada cuánto se leen sus posiciones
  min_account_usd: 100000
  max_account_usd: 50000000
  max_monthly_roi: 3.0
  min_monthly_turnover: 1.0
  max_monthly_turnover: 300.0
