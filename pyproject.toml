[project]
name = "crypto-perp-bot"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "websockets>=13",
  "numpy>=2.0",
  "pyarrow>=16",
  "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["bot/tests"]

[tool.setuptools.packages.find]
include = ["bot*"]

[tool.setuptools.package-data]
bot = ["*.yaml", "dashboard/page.html", "dashboard/vendor/*", "dashboard/static/*"]
